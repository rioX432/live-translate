<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>live-translate</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' vad-asset: 'wasm-unsafe-eval'; worker-src 'self' blob: vad-asset:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' vad-asset: data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <style>
      html, body, #root {
        height: 100%;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.2);
      }
      select:focus-visible, input:focus-visible, button:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 2px;
      }
      select:disabled, input:disabled, button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background: rgba(0,0,0,0);">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
